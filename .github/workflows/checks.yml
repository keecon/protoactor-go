name: checks

on:
  push:
    branches: [v0.2.x]
  pull_request:
    branches: [v0.2.x]
  workflow_dispatch:

permissions:
  contents: read

env:
  TERM: xterm
  REVIVE_FORCE_COLOR: 1

jobs:
  test:
    name: Go ${{ matrix.go_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go_version: ['1.18', '1.19']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go_version }}
          cache: true
          cache-dependency-path: go.sum
      - name: start services
        run: docker compose up -d
      - name: run testcases
        run: make test2
      - name: benchmark
        run: make bench
      - name: linter
        run: make lint
      - name: vet
        run: make vet
