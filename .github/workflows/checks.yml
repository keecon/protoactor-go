name: checks

on:
  push:
    branches: [v0.3.x]
  pull_request:
    branches: [v0.3.x]
  workflow_dispatch:

permissions:
  contents: read

env:
  TERM: xterm
  REVIVE_FORCE_COLOR: 1

jobs:
  test:
    name: Go ${{ matrix.go_version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go_version: ['1.21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go_version }}
          cache: true
          cache-dependency-path: go.sum
      - name: run testcases
        run: make test-short
      - name: vet
        run: make vet
